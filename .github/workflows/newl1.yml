# NEWL-1 (research/preregistrations/NEWL-1.md): do newly listed perpetuals underperform seasoned listings in their first
# month? Run on GitHub's runner because Binance's archive is not reachable from the research director's session.
# RESEARCH ONLY: no account, no key, no order, no model call, no paid service.
# - probe: file names only (which months of daily klines exist for each contract). No price is read.
# - history / forward: refused by the script unless that stage is registered with this exact code and spec (and, for the
#   forward stage, before its archive is whole). Fetches only the months its stage needs, never a day past its last
#   exit, judges once and records the verdict. The forward stage first probes again, for the listings made since.
# The study's records go to main (those paths only); its data go to the newl-data branch.
name: NEWL-1 (new-listing study, research only)
on:
  workflow_dispatch:
    inputs:
      command:
        description: "probe, history or forward"
        required: true
        default: "probe"
permissions:
  contents: write
concurrency:
  group: newl1
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      COMMAND: ${{ github.event.inputs.command }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Restore the study's data from newl-data
        run: |
          git config user.name "newl1"; git config user.email "newl1@users.noreply.github.com"
          if git fetch -q origin newl-data; then
            git worktree add -q pub FETCH_HEAD
          else
            git worktree add -q --detach pub
            (cd pub && git checkout -q --orphan newl-data && git rm -rq --cached . && git clean -fdxq)
          fi
      - name: Run
        run: |
          case "$COMMAND" in
            probe) python scripts/newl1.py probe ;;
            history) python scripts/newl1.py run history --data pub/data ;;
            forward) python scripts/newl1.py probe --out research/results/NEWL-1-F-probe.json &&
                     python scripts/newl1.py run forward --data pub/data --probe research/results/NEWL-1-F-probe.json ;;
            *) echo "unknown command: $COMMAND"; exit 2 ;;
          esac
      - name: Commit the study's records to main
        if: always()
        run: |
          for p in 'research/results/NEWL-1*-probe.json' 'research/knowledge/NEWL-1*.json' research/registry.jsonl; do
            git add -- "$p" 2>/dev/null || true
          done
          if git diff --cached --quiet; then echo "nothing new for main"; exit 0; fi
          git commit -qm "NEWL-1 $COMMAND $(date -u +%Y-%m-%dT%H:%MZ): the study's records"
          for i in 1 2 3 4 5; do
            git push -q origin HEAD:refs/heads/main && exit 0
            git fetch -q origin main && git rebase -q FETCH_HEAD || { git rebase --abort; break; }
            sleep $((i * 15))
          done
          exit 1
      - name: Publish the data to newl-data
        if: always()
        run: |
          cd pub
          git add -A .
          git commit -qm "NEWL-1 data $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "nothing new"; exit 0; }
          for i in 1 2 3 4 5; do git push -q origin HEAD:refs/heads/newl-data && exit 0; sleep $((i * 20)); done
          exit 1
