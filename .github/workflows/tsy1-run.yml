# One-time execution of TSY-1 (research/preregistrations/TSY-1.md) on GitHub's runner, which can reach Yahoo and the
# Treasury's fiscaldata API: fetch IEF and ^IRX daily closes and the 10-year note auction dates, judge 2009..2020, and
# open the 2021-01..2026-09 holdout only if the judge PASSED.
# The result and the registry line are also printed to the log, so a refused push cannot lose them (LVOL-1's was).
# Research only: nothing here touches the paper desk.
name: TSY-1 judge (once)
on:
  push:
    branches: [tsy1-run]
permissions:
  contents: write
jobs:
  tsy1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Refuse to run twice
        run: |
          python - <<'PY'
          import json, sys
          for line in open("research/registry.jsonl"):
              r = json.loads(line)
              if r.get("kind") == "verdict" and r.get("trial") in ("TSY-1", "TSY-1-H"):
                  sys.exit(f"TSY-1 already has a verdict ({r['status']})")
          PY
      - name: Fetch the closes and the auctions (retries on transient errors)
        run: |
          set -o pipefail
          for i in 1 2 3; do
            python scripts/tsy1.py fetch 2>&1 | tee -a tsy1-fetch.log && break
            echo "fetch attempt $i failed" | tee -a tsy1-fetch.log
            sleep $((i * 30))
          done
          test -f data/tsy/manifest.json
          cat data/tsy/manifest.json
      - name: Judge 2009..2020
        run: |
          set -o pipefail
          python scripts/tsy1.py judge 2>&1 | tee tsy1-judge.log
          echo "== research/knowledge/TSY-1.json"; cat research/knowledge/TSY-1.json
          echo "== the registry's last line"; tail -1 research/registry.jsonl
      - name: Open the holdout once, only if the judge PASSED
        run: |
          set -o pipefail
          if grep -q '"verdict": "PASSED"' research/knowledge/TSY-1.json; then
            python scripts/tsy1.py holdout 2>&1 | tee tsy1-holdout.log
            echo "== research/knowledge/TSY-1-H.json"; cat research/knowledge/TSY-1-H.json
            echo "== the registry's last line"; tail -1 research/registry.jsonl
          else
            echo "TSY-1 did not pass: the holdout stays unread" | tee tsy1-holdout.log
          fi
      - name: Commit the artifacts and logs
        if: always()
        run: |
          git config user.name "tsy-runner"; git config user.email "tsy-runner@users.noreply.github.com"
          mkdir -p research/results
          for f in tsy1-fetch.log tsy1-judge.log tsy1-holdout.log; do if [ -f "$f" ]; then mv "$f" research/results/; fi; done
          for f in research/results/tsy1-*.log data/tsy/manifest.json data/tsy/*.csv \
                   research/knowledge/TSY-1.json research/knowledge/TSY-1-H.json research/registry.jsonl; do
            if [ -e "$f" ]; then git add -f "$f"; fi
          done
          git commit -m "TSY-1 run on the GitHub runner [skip ci]" || true
          for i in 1 2 3 4 5; do git push origin HEAD:tsy1-run && exit 0; sleep $((i * 20)); done
          exit 1
