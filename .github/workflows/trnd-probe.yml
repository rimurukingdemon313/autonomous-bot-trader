# TRND-1's fetch probe (scripts/trnd_probe.py): does TRND-1's own Yahoo fetch return every month the judge and the
# holdout need? Dates only (rows, first and last dates, closes per decade, months without a close); nothing is computed
# from a price. Research only.
name: TRND-1 fetch probe
on:
  push:
    branches: [trnd-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Probe the fetch
        run: python scripts/trnd_probe.py 2>&1 | tee trnd-probe.log
      - name: Commit the probe
        if: always()
        run: |
          git config user.name "trnd-runner"; git config user.email "trnd-runner@users.noreply.github.com"
          mkdir -p research/results
          if [ -f trnd-probe.log ]; then mv trnd-probe.log research/results/; fi
          for f in research/results/trnd-probe.log research/results/TRND-probe.json; do
            if [ -e "$f" ]; then git add -f "$f"; fi
          done
          git commit -m "TRND-1 fetch probe on the GitHub runner [skip ci]" || true
          for i in 1 2 3 4; do git push origin HEAD:trnd-probe && break; sleep $((i * 15)); done
