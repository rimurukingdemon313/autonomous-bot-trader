# One-time execution of DAY-1 (research/preregistrations/DAY-1.md) on GitHub's runner, which can reach Yahoo: fetch
# the daily bars of ^GSPC, ^NDX, ^GDAXI and ^FTSE from 1988-06, judge 1990..2020, and open the 2021-01..2026-09
# holdout only if the judge PASSED. The result and the registry line are printed to the log too, so a refused push
# cannot lose them. Research only: nothing here touches the paper desks.
name: DAY-1 judge (once)
on:
  push:
    branches: [day1-run]
permissions:
  contents: write
jobs:
  day1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Refuse to run twice
        run: |
          python - <<'PY'
          import json, sys
          for line in open("research/registry.jsonl"):
              r = json.loads(line)
              if r.get("kind") == "verdict" and r.get("trial") in ("DAY-1", "DAY-1-H"):
                  sys.exit(f"DAY-1 already has a verdict ({r['status']})")
          PY
      - name: Fetch the bars (retries on transient errors)
        run: |
          set -o pipefail
          for i in 1 2 3; do
            python scripts/day1.py fetch 2>&1 | tee -a day1-fetch.log && break
            echo "fetch attempt $i failed" | tee -a day1-fetch.log
            sleep $((i * 30))
          done
          test -f data/day1/manifest.json
          cat data/day1/manifest.json
      - name: Judge 1990..2020
        run: |
          set -o pipefail
          python scripts/day1.py judge 2>&1 | tee day1-judge.log
          echo "== research/knowledge/DAY-1.json"; cat research/knowledge/DAY-1.json
          echo "== the registry's last line"; tail -1 research/registry.jsonl
      - name: Open the holdout once, only if the judge PASSED
        run: |
          set -o pipefail
          if grep -q '"verdict": "PASSED"' research/knowledge/DAY-1.json; then
            python scripts/day1.py holdout 2>&1 | tee day1-holdout.log
            echo "== research/knowledge/DAY-1-H.json"; cat research/knowledge/DAY-1-H.json
            echo "== the registry's last line"; tail -1 research/registry.jsonl
          else
            echo "DAY-1 did not pass: the holdout stays unread" | tee day1-holdout.log
          fi
      - name: Commit the artifacts and logs
        if: always()
        run: |
          git config user.name "day1-runner"; git config user.email "day1-runner@users.noreply.github.com"
          mkdir -p research/results
          cp day1-*.log research/results/ 2>/dev/null || true
          git add -f research/knowledge/DAY-1*.json research/registry.jsonl research/results/day1-*.log || true
          git commit -qm "DAY-1: verdict, artifacts and logs" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5; do git push -q origin HEAD:refs/heads/day1-run && exit 0; sleep $((i * 15)); done
          exit 1
