# Publish the IX-2 H1 artifacts of run 37346706111 (its own publish job could not acquire a runner).
name: IX publish artifacts
on:
  push:
    branches: [runner-ping]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: 37346706111
          github-token: ${{ github.token }}
          path: arts
      - name: Commit to the ix-data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -R arts | head -50
          git init -q data && cd data
          git config user.name "div-runner"; git config user.email "div-runner@users.noreply.github.com"
          git checkout -q --orphan ix-data
          mkdir -p data/ix
          cp ../arts/*/* data/ix/
          ls -la data/ix
          git add data/ix
          git commit -q -m "IX H1 bid/ask bars 2012-2020 (Dukascopy hour candles), from run 37346706111"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ix-data
