# One-time execution of LVOL-1 (research/preregistrations/LVOL-1.md) on GitHub's runner, which can reach Yahoo: fetch
# SPLV, USMV, SPY and ^IRX daily closes, judge 2012..2020, and open the 2021-01..2026-09 holdout only if the judge
# PASSED.
# Research only: nothing here touches the paper desk.
name: LVOL-1 judge (once)
on:
  push:
    branches: [lvol1-run]
permissions:
  contents: write
jobs:
  lvol1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Refuse to run twice
        run: |
          python - <<'PY'
          import json, sys
          for line in open("research/registry.jsonl"):
              r = json.loads(line)
              if r.get("kind") == "verdict" and r.get("trial") in ("LVOL-1", "LVOL-1-H"):
                  sys.exit(f"LVOL-1 already has a verdict ({r['status']})")
          PY
      - name: Fetch the closes (retries on transient errors)
        run: |
          set -o pipefail
          for i in 1 2 3; do
            python scripts/lvol1.py fetch 2>&1 | tee -a lvol1-fetch.log && break
            echo "fetch attempt $i failed" | tee -a lvol1-fetch.log
            sleep $((i * 30))
          done
          test -f data/lvol/manifest.json
      - name: Judge 2012..2020
        run: |
          set -o pipefail
          python scripts/lvol1.py judge 2>&1 | tee lvol1-judge.log
      - name: Open the holdout once, only if the judge PASSED
        run: |
          set -o pipefail
          if grep -q '"verdict": "PASSED"' research/knowledge/LVOL-1.json; then
            python scripts/lvol1.py holdout 2>&1 | tee lvol1-holdout.log
          else
            echo "LVOL-1 did not pass: the holdout stays unread" | tee lvol1-holdout.log
          fi
      - name: Commit the artifacts and logs
        if: always()
        run: |
          git config user.name "lvol-runner"; git config user.email "lvol-runner@users.noreply.github.com"
          mkdir -p research/results
          for f in lvol1-fetch.log lvol1-judge.log lvol1-holdout.log; do if [ -f "$f" ]; then mv "$f" research/results/; fi; done
          for f in research/results/lvol1-*.log data/lvol/manifest.json data/lvol/*.csv \
                   research/knowledge/LVOL-1.json research/knowledge/LVOL-1-H.json research/registry.jsonl; do
            if [ -e "$f" ]; then git add -f "$f"; fi
          done
          git commit -m "LVOL-1 run on the GitHub runner [skip ci]" || true
          git push origin HEAD:lvol1-run
