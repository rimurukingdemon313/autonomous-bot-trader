# One-time execution of TME-1 (research/preregistrations/TME-1.md) on GitHub's runner, which can reach Yahoo: fetch IEF
# and ^IRX daily closes, judge 2003..2018, and open the 2019-01..2026-09 holdout only if the judge PASSED.
# The result and the registry line are also printed to the log, so a refused push cannot lose them (LVOL-1's was).
# Research only: nothing here touches the paper desk.
name: TME-1 judge (once)
on:
  push:
    branches: [tme1-run]
permissions:
  contents: write
jobs:
  tme1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Refuse to run twice
        run: |
          python - <<'PY'
          import json, sys
          for line in open("research/registry.jsonl"):
              r = json.loads(line)
              if r.get("kind") == "verdict" and r.get("trial") in ("TME-1", "TME-1-H"):
                  sys.exit(f"TME-1 already has a verdict ({r['status']})")
          PY
      - name: Fetch the closes (retries on transient errors)
        run: |
          set -o pipefail
          for i in 1 2 3; do
            python scripts/tme1.py fetch 2>&1 | tee -a tme1-fetch.log && break
            echo "fetch attempt $i failed" | tee -a tme1-fetch.log
            sleep $((i * 30))
          done
          test -f data/tme/manifest.json
          cat data/tme/manifest.json
      - name: Judge 2003..2018
        run: |
          set -o pipefail
          python scripts/tme1.py judge 2>&1 | tee tme1-judge.log
          echo "== research/knowledge/TME-1.json"; cat research/knowledge/TME-1.json
          echo "== the registry's last line"; tail -1 research/registry.jsonl
      - name: Open the holdout once, only if the judge PASSED
        run: |
          set -o pipefail
          if grep -q '"verdict": "PASSED"' research/knowledge/TME-1.json; then
            python scripts/tme1.py holdout 2>&1 | tee tme1-holdout.log
            echo "== research/knowledge/TME-1-H.json"; cat research/knowledge/TME-1-H.json
            echo "== the registry's last line"; tail -1 research/registry.jsonl
          else
            echo "TME-1 did not pass: the holdout stays unread" | tee tme1-holdout.log
          fi
      - name: Commit the artifacts and logs
        if: always()
        run: |
          git config user.name "tme-runner"; git config user.email "tme-runner@users.noreply.github.com"
          mkdir -p research/results
          for f in tme1-fetch.log tme1-judge.log tme1-holdout.log; do if [ -f "$f" ]; then mv "$f" research/results/; fi; done
          for f in research/results/tme1-*.log data/tme/manifest.json data/tme/*.csv \
                   research/knowledge/TME-1.json research/knowledge/TME-1-H.json research/registry.jsonl; do
            if [ -e "$f" ]; then git add -f "$f"; fi
          done
          git commit -m "TME-1 run on the GitHub runner [skip ci]" || true
          for i in 1 2 3 4 5; do git push origin HEAD:tme1-run && exit 0; sleep $((i * 20)); done
          exit 1
