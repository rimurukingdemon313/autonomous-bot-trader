# One-time execution of XSM-1 (research/preregistrations/XSM-1.md) on GitHub's runner, which can reach Binance's
# public archive: fetch every USDT pair's daily klines (each month checked against its sha256), judge 2018-10..2024-06,
# and open the 2024-07..2026-09 holdout only if the judge PASSED. Research only: nothing here touches the paper desk.
name: XSM-1 judge (once)
on:
  push:
    branches: [xsm1-run]
permissions:
  contents: write
jobs:
  xsm1:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Refuse to run twice
        run: |
          python - <<'PY'
          import json, sys
          for line in open("research/registry.jsonl"):
              r = json.loads(line)
              if r.get("kind") == "verdict" and r.get("trial") in ("XSM-1", "XSM-1-H"):
                  sys.exit(f"XSM-1 already has a verdict ({r['status']})")
          PY
      - name: Fetch the archive (retries on transient errors)
        run: |
          set -o pipefail
          for i in 1 2 3; do
            python scripts/xsm1.py fetch 2>&1 | tee -a xsm1-fetch.log && break
            echo "fetch attempt $i failed" | tee -a xsm1-fetch.log
            sleep $((i * 60))
          done
          test -f data/xsm/manifest.json
      - name: Judge 2018-10..2024-06
        run: |
          set -o pipefail
          python scripts/xsm1.py judge 2>&1 | tee xsm1-judge.log
      - name: Open the holdout once, only if the judge PASSED
        run: |
          set -o pipefail
          if grep -q '"verdict": "PASSED"' research/knowledge/XSM-1.json; then
            python scripts/xsm1.py holdout 2>&1 | tee xsm1-holdout.log
          else
            echo "XSM-1 did not pass: the holdout stays unread" | tee xsm1-holdout.log
          fi
      - name: Commit the artifacts and logs
        if: always()
        run: |
          git config user.name "xsm-runner"; git config user.email "xsm-runner@users.noreply.github.com"
          mkdir -p research/results
          for f in xsm1-fetch.log xsm1-judge.log xsm1-holdout.log; do if [ -f "$f" ]; then mv "$f" research/results/; fi; done
          for f in research/results/xsm1-*.log data/xsm/manifest.json data/xsm/klines.csv.gz \
                   research/knowledge/XSM-1.json research/knowledge/XSM-1-H.json research/registry.jsonl; do
            if [ -e "$f" ]; then git add -f "$f"; fi
          done
          git commit -m "XSM-1 run on the GitHub runner [skip ci]" || true
          git push origin HEAD:xsm1-run
