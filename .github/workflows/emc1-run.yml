# One-time execution of EMC-1 (research/preregistrations/EMC-1.md) on GitHub's runner, which can reach Yahoo and the
# BIS: fetch six currencies' daily closes and seven policy rates, judge 2005-02..2019-12, and open the 2020-01..2026-09
# holdout only if the judge PASSED.
# Research only: nothing here touches the paper desk.
name: EMC-1 judge (once)
on:
  push:
    branches: [emc1-run]
permissions:
  contents: write
jobs:
  emc1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Refuse to run twice
        run: |
          python - <<'PY'
          import json, sys
          for line in open("research/registry.jsonl"):
              r = json.loads(line)
              if r.get("kind") == "verdict" and r.get("trial") in ("EMC-1", "EMC-1-H"):
                  sys.exit(f"EMC-1 already has a verdict ({r['status']})")
          PY
      - name: Fetch the closes (retries on transient errors)
        run: |
          set -o pipefail
          for i in 1 2 3; do
            python scripts/emc1.py fetch 2>&1 | tee -a emc1-fetch.log && break
            echo "fetch attempt $i failed" | tee -a emc1-fetch.log
            sleep $((i * 30))
          done
          test -f data/emc/manifest.json
      - name: Judge 2005-02..2019
        run: |
          set -o pipefail
          python scripts/emc1.py judge 2>&1 | tee emc1-judge.log
      - name: Open the holdout once, only if the judge PASSED
        run: |
          set -o pipefail
          if grep -q '"verdict": "PASSED"' research/knowledge/EMC-1.json; then
            python scripts/emc1.py holdout 2>&1 | tee emc1-holdout.log
          else
            echo "EMC-1 did not pass: the holdout stays unread" | tee emc1-holdout.log
          fi
      - name: Commit the artifacts and logs
        if: always()
        run: |
          git config user.name "emc-runner"; git config user.email "emc-runner@users.noreply.github.com"
          mkdir -p research/results
          for f in emc1-fetch.log emc1-judge.log emc1-holdout.log; do if [ -f "$f" ]; then mv "$f" research/results/; fi; done
          for f in research/results/emc1-*.log data/emc/manifest.json data/emc/*.csv \
                   research/knowledge/EMC-1.json research/knowledge/EMC-1-H.json research/registry.jsonl; do
            if [ -e "$f" ]; then git add -f "$f"; fi
          done
          git commit -m "EMC-1 run on the GitHub runner [skip ci]" || true
          git push origin HEAD:emc1-run
