# GSR-1's source probe (scripts/gsr_probe.py): which public source has daily gold and silver prices. Metadata only
# (status, rows, first and last dates); nothing is computed from a price. Research only.
name: GSR-1 source probe
on:
  push:
    branches: [gsr-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe the sources
        run: python scripts/gsr_probe.py 2>&1 | tee gsr-probe.log
      - name: Commit the probe
        if: always()
        run: |
          git config user.name "gsr-runner"; git config user.email "gsr-runner@users.noreply.github.com"
          mkdir -p research/results
          if [ -f gsr-probe.log ]; then mv gsr-probe.log research/results/; fi
          for f in research/results/gsr-probe.log research/results/GSR-probe.json; do
            if [ -e "$f" ]; then git add -f "$f"; fi
          done
          git commit -m "GSR-1 source probe on the GitHub runner [skip ci]" || true
          git push origin HEAD:gsr-probe
