# One-time execution of XTS-1 (research/preregistrations/XTS-1.md) on GitHub's runner, which can reach Binance's
# public archives: fetch the daily klines, judge 2018-01..2024-06, and open the 2024-07..2026-09 holdout only if the
# judge PASSED. Research only: nothing here touches the paper desk.
name: XTS-1 judge (once)
on:
  push:
    branches: [xts1-run]
permissions:
  contents: write
jobs:
  xts1:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Refuse to run twice
        run: |
          python - <<'PY'
          import json, sys
          for line in open("research/registry.jsonl"):
              r = json.loads(line)
              if r.get("kind") == "verdict" and r.get("trial") in ("XTS-1", "XTS-1-H"):
                  sys.exit(f"XTS-1 already has a verdict ({r['status']})")
          PY
      - name: Fetch the daily klines (retries on transient errors)
        timeout-minutes: 20
        run: |
          set -o pipefail
          for i in 1 2 3; do
            python scripts/xts1.py fetch 2>&1 | tee -a xts1-fetch.log && break
            echo "fetch attempt $i failed" | tee -a xts1-fetch.log
            sleep $((i * 30))
          done
          test -f data/xts/manifest.json
      - name: Judge 2018-01..2024-06
        run: |
          set -o pipefail
          python scripts/xts1.py judge 2>&1 | tee xts1-judge.log
      - name: Open the holdout once, only if the judge PASSED
        run: |
          set -o pipefail
          if grep -q '"verdict": "PASSED"' research/knowledge/XTS-1.json; then
            python scripts/xts1.py holdout 2>&1 | tee xts1-holdout.log
          else
            echo "XTS-1 did not pass: the holdout stays unread" | tee xts1-holdout.log
          fi
      - name: Commit the artifacts and logs
        if: always()
        run: |
          git config user.name "xts-runner"; git config user.email "xts-runner@users.noreply.github.com"
          mkdir -p research/results
          for f in xts1-fetch.log xts1-judge.log xts1-holdout.log; do [ -f "$f" ] && mv "$f" research/results/; done
          for f in research/results/xts1-*.log data/xts/manifest.json data/xts/BTCUSDT_1d.csv data/xts/ETHUSDT_1d.csv \
                   research/knowledge/XTS-1.json research/knowledge/XTS-1-H.json research/registry.jsonl; do
            if [ -e "$f" ]; then git add -f "$f"; fi
          done
          git commit -m "XTS-1 run on the GitHub runner [skip ci]" || true
          git push origin HEAD:xts1-run
