# Availability probe for the intraday program: format, coverage and throughput of the Dukascopy datafeed.
name: ID availability probe
on:
  push:
    branches: [id-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/id_probe.py
      - name: Commit the probe
        if: always()
        run: |
          git config user.name "div-runner"; git config user.email "div-runner@users.noreply.github.com"
          git add -f research/results/id-probe.json || true
          git commit -m "ID availability probe [skip ci]" || true
          git push origin HEAD:id-probe
