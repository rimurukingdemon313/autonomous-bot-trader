# One-time execution of FOMC-1 (research/preregistrations/FOMC-1.md) on GitHub's runner, which can reach Dukascopy's
# datafeed: fetch the two minutes each window needs, judge 2016..2021, and open the 2022-01..2026-09 holdout only if
# the judge PASSED. Research only: nothing here touches the paper desk.
name: FOMC-1 judge (once)
on:
  push:
    branches: [fomc1-run]
permissions:
  contents: write
jobs:
  fomc1:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Refuse to run twice
        run: |
          python - <<'PY'
          import json, sys
          for line in open("research/registry.jsonl"):
              r = json.loads(line)
              if r.get("kind") == "verdict" and r.get("trial") in ("FOMC-1", "FOMC-1-H"):
                  sys.exit(f"FOMC-1 already has a verdict ({r['status']})")
          PY
      - name: Fetch the quotes (retries on transient errors)
        run: |
          set -o pipefail
          for i in 1 2 3; do
            python scripts/fomc1.py fetch 2>&1 | tee -a fomc1-fetch.log && break
            echo "fetch attempt $i failed" | tee -a fomc1-fetch.log
            sleep $((i * 60))
          done
          test -f data/fomc/manifest.json
      - name: Judge 2016..2021
        run: |
          set -o pipefail
          python scripts/fomc1.py judge 2>&1 | tee fomc1-judge.log
      - name: Open the holdout once, only if the judge PASSED
        run: |
          set -o pipefail
          if grep -q '"verdict": "PASSED"' research/knowledge/FOMC-1.json; then
            python scripts/fomc1.py holdout 2>&1 | tee fomc1-holdout.log
          else
            echo "FOMC-1 did not pass: the holdout stays unread" | tee fomc1-holdout.log
          fi
      - name: Commit the artifacts and logs
        if: always()
        run: |
          git config user.name "fomc-runner"; git config user.email "fomc-runner@users.noreply.github.com"
          mkdir -p research/results
          for f in fomc1-fetch.log fomc1-judge.log fomc1-holdout.log; do if [ -f "$f" ]; then mv "$f" research/results/; fi; done
          for f in research/results/fomc1-*.log data/fomc/manifest.json data/fomc/quotes.csv \
                   research/knowledge/FOMC-1.json research/knowledge/FOMC-1-H.json research/registry.jsonl; do
            if [ -e "$f" ]; then git add -f "$f"; fi
          done
          git commit -m "FOMC-1 run on the GitHub runner [skip ci]" || true
          git push origin HEAD:fomc1-run
