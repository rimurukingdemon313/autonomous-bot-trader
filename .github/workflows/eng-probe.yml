# ENG-1 data probe (scripts/eng_probe.py): which EIA futures-price series exist (contracts 1-4 of WTI, heating oil,
# gasoline and natural gas), from when to when, and with what gaps. Dates only: no price, return or spread is computed
# or kept. Research only. EIA is reachable from GitHub's runner and not from the development container.
name: ENG-1 data probe
on:
  push:
    branches: [eng-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt && pip install "xlrd==2.0.1"
      - name: Probe the EIA series
        run: python scripts/eng_probe.py 2>&1 | tee eng-probe.log
      - name: Commit the probe
        if: always()
        run: |
          git config user.name "eng-runner"; git config user.email "eng-runner@users.noreply.github.com"
          mkdir -p research/results
          if [ -f eng-probe.log ]; then mv eng-probe.log research/results/; fi
          for f in research/results/eng-probe.log research/results/ENG-probe.json; do
            if [ -e "$f" ]; then git add -f "$f"; fi
          done
          git commit -m "ENG-1 data probe on the GitHub runner [skip ci]" || true
          for i in 1 2 3 4; do git push origin HEAD:eng-probe && break; sleep $((i * 15)); done
