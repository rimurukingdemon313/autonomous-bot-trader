# LIQ-1 data probe (scripts/liq_probe.py): which Binance USDT-M open-interest and kline files exist on
# data.binance.vision for BTC and ETH, from when to when, and with what gaps. Dates and column names only: no value is
# read or kept. Research only. Binance is reachable from GitHub's runner and not from the development container.
name: LIQ-1 data probe
on:
  push:
    branches: [liq-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Probe the Binance files
        run: python scripts/liq_probe.py 2>&1 | tee liq-probe.log
      - name: Commit the probe
        if: always()
        run: |
          git config user.name "liq-runner"; git config user.email "liq-runner@users.noreply.github.com"
          mkdir -p research/results
          if [ -f liq-probe.log ]; then mv liq-probe.log research/results/; fi
          for f in research/results/liq-probe.log research/results/LIQ-probe.json; do
            if [ -e "$f" ]; then git add -f "$f"; fi
          done
          git commit -m "LIQ-1 data probe on the GitHub runner [skip ci]" || true
          for i in 1 2 3 4; do git push origin HEAD:liq-probe && break; sleep $((i * 15)); done
