# One-time execution of GSR-1 (research/preregistrations/GSR-1.md) on GitHub's runner, which can reach Yahoo: fetch
# GC=F and SI=F daily closes, judge 2002..2019, and open the 2020-01..2026-09 holdout only if the judge PASSED.
# Research only: nothing here touches the paper desk.
name: GSR-1 judge (once)
on:
  push:
    branches: [gsr1-run]
permissions:
  contents: write
jobs:
  gsr1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Refuse to run twice
        run: |
          python - <<'PY'
          import json, sys
          for line in open("research/registry.jsonl"):
              r = json.loads(line)
              if r.get("kind") == "verdict" and r.get("trial") in ("GSR-1", "GSR-1-H"):
                  sys.exit(f"GSR-1 already has a verdict ({r['status']})")
          PY
      - name: Fetch the closes (retries on transient errors)
        run: |
          set -o pipefail
          for i in 1 2 3; do
            python scripts/gsr1.py fetch 2>&1 | tee -a gsr1-fetch.log && break
            echo "fetch attempt $i failed" | tee -a gsr1-fetch.log
            sleep $((i * 30))
          done
          test -f data/gsr/manifest.json
      - name: Judge 2002..2019
        run: |
          set -o pipefail
          python scripts/gsr1.py judge 2>&1 | tee gsr1-judge.log
      - name: Open the holdout once, only if the judge PASSED
        run: |
          set -o pipefail
          if grep -q '"verdict": "PASSED"' research/knowledge/GSR-1.json; then
            python scripts/gsr1.py holdout 2>&1 | tee gsr1-holdout.log
          else
            echo "GSR-1 did not pass: the holdout stays unread" | tee gsr1-holdout.log
          fi
      - name: Commit the artifacts and logs
        if: always()
        run: |
          git config user.name "gsr-runner"; git config user.email "gsr-runner@users.noreply.github.com"
          mkdir -p research/results
          for f in gsr1-fetch.log gsr1-judge.log gsr1-holdout.log; do if [ -f "$f" ]; then mv "$f" research/results/; fi; done
          for f in research/results/gsr1-*.log data/gsr/manifest.json data/gsr/GC_F.csv data/gsr/SI_F.csv \
                   research/knowledge/GSR-1.json research/knowledge/GSR-1-H.json research/registry.jsonl; do
            if [ -e "$f" ]; then git add -f "$f"; fi
          done
          git commit -m "GSR-1 run on the GitHub runner [skip ci]" || true
          git push origin HEAD:gsr1-run
