# One-time execution of SEC-1 (research/preregistrations/SEC-1.md) on GitHub's runner, which can reach Yahoo: fetch
# the nine sector funds' daily closes, judge 2000..2017, and open the 2018-01..2026-09 holdout only if the judge PASSED.
# Research only: nothing here touches the paper desk.
name: SEC-1 judge (once)
on:
  push:
    branches: [sec1-run]
permissions:
  contents: write
jobs:
  sec1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Refuse to run twice
        run: |
          python - <<'PY'
          import json, sys
          for line in open("research/registry.jsonl"):
              r = json.loads(line)
              if r.get("kind") == "verdict" and r.get("trial") in ("SEC-1", "SEC-1-H"):
                  sys.exit(f"SEC-1 already has a verdict ({r['status']})")
          PY
      - name: Fetch the closes (retries on transient errors)
        run: |
          set -o pipefail
          for i in 1 2 3; do
            python scripts/sec1.py fetch 2>&1 | tee -a sec1-fetch.log && break
            echo "fetch attempt $i failed" | tee -a sec1-fetch.log
            sleep $((i * 30))
          done
          test -f data/sec/manifest.json
      - name: Judge 2000..2017
        run: |
          set -o pipefail
          python scripts/sec1.py judge 2>&1 | tee sec1-judge.log
      - name: Open the holdout once, only if the judge PASSED
        run: |
          set -o pipefail
          if grep -q '"verdict": "PASSED"' research/knowledge/SEC-1.json; then
            python scripts/sec1.py holdout 2>&1 | tee sec1-holdout.log
          else
            echo "SEC-1 did not pass: the holdout stays unread" | tee sec1-holdout.log
          fi
      - name: Commit the artifacts and logs
        if: always()
        run: |
          git config user.name "sec-runner"; git config user.email "sec-runner@users.noreply.github.com"
          mkdir -p research/results
          for f in sec1-fetch.log sec1-judge.log sec1-holdout.log; do if [ -f "$f" ]; then mv "$f" research/results/; fi; done
          for f in research/results/sec1-*.log data/sec/manifest.json data/sec/*.csv \
                   research/knowledge/SEC-1.json research/knowledge/SEC-1-H.json research/registry.jsonl; do
            if [ -e "$f" ]; then git add -f "$f"; fi
          done
          git commit -m "SEC-1 run on the GitHub runner [skip ci]" || true
          git push origin HEAD:sec1-run
