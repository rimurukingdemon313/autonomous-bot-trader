# One-time execution of VOLM-1 (research/preregistrations/VOLM-1.md) on GitHub's runner, which can reach Yahoo: fetch
# SPY and ^IRX daily closes, judge 1995..2021, and open the 2022-01..2026-09 holdout only if the judge PASSED.
# Research only: nothing here touches the paper desk.
name: VOLM-1 judge (once)
on:
  push:
    branches: [volm1-run]
permissions:
  contents: write
jobs:
  volm1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Refuse to run twice
        run: |
          python - <<'PY'
          import json, sys
          for line in open("research/registry.jsonl"):
              r = json.loads(line)
              if r.get("kind") == "verdict" and r.get("trial") in ("VOLM-1", "VOLM-1-H"):
                  sys.exit(f"VOLM-1 already has a verdict ({r['status']})")
          PY
      - name: Fetch the closes (retries on transient errors)
        run: |
          set -o pipefail
          for i in 1 2 3; do
            python scripts/volm1.py fetch 2>&1 | tee -a volm1-fetch.log && break
            echo "fetch attempt $i failed" | tee -a volm1-fetch.log
            sleep $((i * 30))
          done
          test -f data/volm/manifest.json
      - name: Judge 1995..2021
        run: |
          set -o pipefail
          python scripts/volm1.py judge 2>&1 | tee volm1-judge.log
      - name: Open the holdout once, only if the judge PASSED
        run: |
          set -o pipefail
          if grep -q '"verdict": "PASSED"' research/knowledge/VOLM-1.json; then
            python scripts/volm1.py holdout 2>&1 | tee volm1-holdout.log
          else
            echo "VOLM-1 did not pass: the holdout stays unread" | tee volm1-holdout.log
          fi
      - name: Commit the artifacts and logs
        if: always()
        run: |
          git config user.name "volm-runner"; git config user.email "volm-runner@users.noreply.github.com"
          mkdir -p research/results
          for f in volm1-fetch.log volm1-judge.log volm1-holdout.log; do if [ -f "$f" ]; then mv "$f" research/results/; fi; done
          for f in research/results/volm1-*.log data/volm/manifest.json data/volm/SPY.csv data/volm/IRX.csv \
                   research/knowledge/VOLM-1.json research/knowledge/VOLM-1-H.json research/registry.jsonl; do
            if [ -e "$f" ]; then git add -f "$f"; fi
          done
          git commit -m "VOLM-1 run on the GitHub runner [skip ci]" || true
          git push origin HEAD:volm1-run
