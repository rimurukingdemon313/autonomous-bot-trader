# One-time execution of VRP-1 (research/preregistrations/VRP-1.md) on GitHub's runner, which can reach Yahoo: fetch
# VIXY, VIX and VIX3M daily closes, judge 2011-02..2021, and open the 2022-01..2026-09 holdout only if the judge PASSED.
# Research only: nothing here touches the paper desk.
name: VRP-1 judge (once)
on:
  push:
    branches: [vrp1-run]
permissions:
  contents: write
jobs:
  vrp1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Refuse to run twice
        run: |
          python - <<'PY'
          import json, sys
          for line in open("research/registry.jsonl"):
              r = json.loads(line)
              if r.get("kind") == "verdict" and r.get("trial") in ("VRP-1", "VRP-1-H"):
                  sys.exit(f"VRP-1 already has a verdict ({r['status']})")
          PY
      - name: Fetch the closes (retries on transient errors)
        run: |
          set -o pipefail
          for i in 1 2 3; do
            python scripts/vrp1.py fetch 2>&1 | tee -a vrp1-fetch.log && break
            echo "fetch attempt $i failed" | tee -a vrp1-fetch.log
            sleep $((i * 30))
          done
          test -f data/vrp/manifest.json
      - name: Judge 2011-02..2021
        run: |
          set -o pipefail
          python scripts/vrp1.py judge 2>&1 | tee vrp1-judge.log
      - name: Open the holdout once, only if the judge PASSED
        run: |
          set -o pipefail
          if grep -q '"verdict": "PASSED"' research/knowledge/VRP-1.json; then
            python scripts/vrp1.py holdout 2>&1 | tee vrp1-holdout.log
          else
            echo "VRP-1 did not pass: the holdout stays unread" | tee vrp1-holdout.log
          fi
      - name: Commit the artifacts and logs
        if: always()
        run: |
          git config user.name "vrp-runner"; git config user.email "vrp-runner@users.noreply.github.com"
          mkdir -p research/results
          for f in vrp1-fetch.log vrp1-judge.log vrp1-holdout.log; do if [ -f "$f" ]; then mv "$f" research/results/; fi; done
          for f in research/results/vrp1-*.log data/vrp/manifest.json data/vrp/VIXY.csv data/vrp/VIX.csv data/vrp/VIX3M.csv \
                   research/knowledge/VRP-1.json research/knowledge/VRP-1-H.json research/registry.jsonl; do
            if [ -e "$f" ]; then git add -f "$f"; fi
          done
          git commit -m "VRP-1 run on the GitHub runner [skip ci]" || true
          git push origin HEAD:vrp1-run
