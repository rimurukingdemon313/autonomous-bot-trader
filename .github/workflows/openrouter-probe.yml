name: OpenRouter free-model probe (once)
on:
  push:
    branches: [openrouter-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/openrouter_models.py --out openrouter-free-models.json
      - name: Commit the result
        if: always()
        run: |
          git config user.name "probe"; git config user.email "probe@users.noreply.github.com"
          git checkout --orphan openrouter-probe-results
          git rm -rfq --cached .
          git add -f openrouter-free-models.json
          git commit -qm "OpenRouter free-model probe"
          git push -qf origin HEAD:openrouter-probe-results
