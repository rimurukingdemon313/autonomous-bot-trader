# Data-availability probe for DIV-2 (dates and row counts only).
name: DIV-2 availability probe
on:
  push:
    branches: [div2-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/div2_probe.py
        timeout-minutes: 8
        continue-on-error: true
      - if: always()
        run: |
          git config user.name "div-runner"; git config user.email "div-runner@users.noreply.github.com"
          git add -f research/results/DIV-2-probe.json || true
          git commit -m "DIV-2 availability probe [skip ci]" || true
          git push origin HEAD:div2-probe
