# The continuous PAPER_FORWARD run (docs/PAPER_FORWARD.md): the real service in 6-hour shifts on GitHub's runner,
# which can reach live market data. PAPER ONLY: simulated orders on a $200,000 paper account, no broker, no key
# to any account, no real money. The paper account (database) is carried from shift to shift in the Actions
# cache, with a snapshot on the `paper-forward-data` branch; the dashboard view is published there every 15 min.
#
# Decision system: the repository variable PF_DECISION_MODE when set. Otherwise `dual_ai` (docs/DUAL_AI.md: two
# free OpenRouter models must agree) as soon as the owner adds the Actions secret OPENROUTER_API_KEY, deciding
# every 75 minutes on one pair in rotation (2 or 3 requests each: inside a free key's 50 a day; PF_DECISION_INTERVAL_MIN and
# PF_SYMBOLS_PER_CYCLE override), and `evidence` (deterministic) without it. The other model modes read the
# secret AI_API_KEY with variables AI_PROVIDER, AI_BASE_URL, AI_MODEL. Keys are the owner's to add in the
# repository settings; they are never written anywhere else.
name: Paper forward test (continuous, paper only)
on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: paper-forward
  cancel-in-progress: false
jobs:
  shift:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      MODE: PAPER_FORWARD
      DATA_DIR: pf-state
      DATA_SOURCE: yahoo
      DECISION_MODE: ${{ vars.PF_DECISION_MODE || (secrets.OPENROUTER_API_KEY != '' && 'dual_ai' || 'evidence') }}
      DECISION_INTERVAL_MIN: ${{ vars.PF_DECISION_INTERVAL_MIN || (secrets.OPENROUTER_API_KEY != '' && !vars.PF_DECISION_MODE && '75' || '0') }}
      SYMBOLS_PER_CYCLE: ${{ vars.PF_SYMBOLS_PER_CYCLE || (secrets.OPENROUTER_API_KEY != '' && !vars.PF_DECISION_MODE && '1' || '0') }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      AI_PROVIDER: ${{ vars.AI_PROVIDER || 'none' }}
      AI_BASE_URL: ${{ vars.AI_BASE_URL }}
      AI_MODEL: ${{ vars.AI_MODEL }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: paper-forward-data
          path: pf-pub
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Restore the paper account
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: pf-state
          key: pf-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pf-state-
      - name: Fall back to the published snapshot if the cache is gone
        if: steps.cache.outputs.cache-matched-key == ''
        run: |
          mkdir -p pf-state
          if [ -f pf-pub/aitrader.db.gz ]; then gunzip -c pf-pub/aitrader.db.gz > pf-state/aitrader.db; fi
      - name: One shift of the service
        run: |
          cd pf-pub && git config user.name "paper-forward" && git config user.email "paper-forward@users.noreply.github.com" && cd ..
          python scripts/paper_forward_shift.py --publish pf-pub --minutes 335 --every 15
      - name: Save the paper account
        if: always()
        uses: actions/cache/save@v4
        with:
          path: pf-state
          key: pf-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Start the next shift
        # GitHub's cron is best-effort; the run continues by dispatching its own next shift.
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/actions/workflows/paper-forward.yml/dispatches" -f ref=main
      - name: Keep the schedule enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/paper-forward.yml/enable" || true
