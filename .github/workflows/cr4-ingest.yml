# CR-4 data: Hyperliquid funding + daily candles and Binance perp funding + 1d klines, listing -> 2025-06-30 only
# (CR-4's holdout, 2025-07 onward, is not fetched). Bars go to the orphan branch cr4-data, never to main.
name: CR-4 ingest
on:
  push:
    branches: [cr4-ingest]
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy
      - run: |
          mkdir -p out
          python scripts/ingest_xv.py --shard ${{ matrix.shard }} --nshards 8 --out out 2>&1 | tee out/ingest_shard${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr4-${{ matrix.shard }}
          path: out/
  publish:
    needs: ingest
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: arts
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q data && cd data
          git config user.name "div-runner"; git config user.email "div-runner@users.noreply.github.com"
          git checkout -q --orphan cr4-data
          mkdir -p data/cr4
          cp ../arts/*/* data/cr4/ 2>/dev/null || true
          git add data/cr4
          git commit -q -m "CR-4 data: Hyperliquid and Binance perpetual funding and daily prices to 2025-06-30"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" cr4-data
