# SQZ-1 (research/preregistrations/SQZ-1.md): do crowded shorts pay the spot buyer? Run on
# GitHub's runner because Binance's archive is not reachable from the research director's session.
# RESEARCH ONLY: no account, no key, no order, no model call, no paid service.
# - probe: spot file names, and the USDT-M funding rates of 2020-12 to 2025-06 (the signal). No spot price is read.
# - dev / validation / holdout / forward: refused by the script unless that stage is registered with this exact code
#   and spec, the stage before it PASSED and (forward) its archive is whole. Each fetches only the months its stage
#   needs, never a close past its last exit, judges once and records the verdict. The instrument is spot, bought
#   outright; the perpetual's funding is information only.
# The study's records go to main (those paths only); its data go to the sqz-data branch.
name: SQZ-1 (crowded shorts and the spot buyer, research only)
on:
  workflow_dispatch:
    inputs:
      command:
        description: "probe, dev, validation, holdout or forward"
        required: true
        default: "probe"
permissions:
  contents: write
concurrency:
  group: sqz1
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      COMMAND: ${{ github.event.inputs.command }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Restore the study's data from sqz-data
        run: |
          git config user.name "sqz1"; git config user.email "sqz1@users.noreply.github.com"
          if git fetch -q origin sqz-data; then
            git worktree add -q pub FETCH_HEAD
          else
            git worktree add -q --detach pub
            (cd pub && git checkout -q --orphan sqz-data && git rm -rq --cached . && git clean -fdxq)
          fi
      - name: Run
        run: |
          case "$COMMAND" in
            probe) python scripts/sqz1.py probe ;;
            dev|validation|holdout) python scripts/sqz1.py run "$COMMAND" --data pub/data ;;
            forward) python scripts/exf1.py probe --no-funding --out research/results/SQZ-1-F-perps.json &&
                     python scripts/sqz1.py probe --perps research/results/SQZ-1-F-perps.json --out research/results/SQZ-1-F-probe.json &&
                     python scripts/sqz1.py run forward --data pub/data --probe research/results/SQZ-1-F-probe.json ;;
            *) echo "unknown command: $COMMAND"; exit 2 ;;
          esac
      - name: Commit the study's records to main
        if: always()
        run: |
          for p in 'research/results/SQZ-1*-probe.json' 'research/results/SQZ-1*-perps.json' 'research/knowledge/SQZ-1*.json' research/registry.jsonl; do
            git add -- "$p" 2>/dev/null || true
          done
          if git diff --cached --quiet; then echo "nothing new for main"; exit 0; fi
          git commit -qm "SQZ-1 $COMMAND $(date -u +%Y-%m-%dT%H:%MZ): the study's records"
          for i in 1 2 3 4 5; do
            git push -q origin HEAD:refs/heads/main && exit 0
            git fetch -q origin main && git rebase -q FETCH_HEAD || { git rebase --abort; break; }
            sleep $((i * 15))
          done
          exit 1
      - name: Publish the data to sqz-data
        if: always()
        run: |
          cd pub
          git add -A .
          git commit -qm "SQZ-1 data $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "nothing new"; exit 0; }
          for i in 1 2 3 4 5; do git push -q origin HEAD:refs/heads/sqz-data && exit 0; sleep $((i * 20)); done
          exit 1
