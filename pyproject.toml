[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aitrader"
version = "0.1.0"
description = "Autonomous AI trading research and decision system"
requires-python = ">=3.11"
# Production inference depends on numpy only (MODEL_CONTRACT.md §4).
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# Research-only tooling: ingestion of raw tick files.
research = ["pandas>=2.0"]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["aitrader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Correctness only: syntax errors and pyflakes (undefined names, unused imports and variables).
# Style rules are deliberately not enforced; a project-level config keeps a user-global one from applying.
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Registered study code is frozen by hash (its spec records code_sha256 and a test checks it):
# a lint edit would silently invalidate the registration, so these files are never auto-fixed.
"aitrader/research/discovery/carry.py" = ["F401"]
"aitrader/research/discovery/flow.py" = ["F401"]
"aitrader/research/discovery/library.py" = ["F401"]
"aitrader/research/discovery/program.py" = ["F401"]
"scripts/cot1.py" = ["F401"]
"scripts/flow1.py" = ["F401"]
"scripts/id2.py" = ["F401"]
"scripts/r3_report.py" = ["F401"]
"scripts/rc_eq2.py" = ["F401"]
"scripts/rv1.py" = ["F401"]
